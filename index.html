<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Otaku Drip | Anime Streetwear</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVIGATION -->

    <header class="navbar">

        <div class="logo">
              Himalayan Otaku
        </div>

        <nav>

            <a href="#home">
                Home
            </a>

            <a href="#shop">
                Shop
            </a>

            <a href="#about">
                About
            </a>
            
        <div class="cart-header">

            <h2>
                YOUR CART
            </h2>

            <button id="close-cart">
                ×
            </button>

        </div>


        <div id="cart-items">

            <p class="empty">
                Your cart is empty.
            </p>

        </div>


        <div class="cart-footer">

            <h3>

                Total:
                $<span id="cart-total">
                    0.00
                </span>

            </h3>

            <button
                id="order-button"
                class="order-button"
            >
                ORDER NOW
            </button>

        </div>

    </aside>



    <!-- FOOTER -->

    <footer>

        <div class="logo">
            Himalayan Otaku
        </div>

        <p>
            © 2026 Himalayan Otaku
        </p>

    </footer>



    <script src="script.js"></script>

</body>

        </html>
